name: ClipFarm cloud worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clipfarm-cloud-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Set up Node.js for YouTube challenge solving
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clipfarm-whisper-${{ runner.os }}-base-v1

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt

      - name: Install YouTube PO-token provider
        run: |
          rm -rf "$HOME/bgutil-ytdlp-pot-provider"
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clipfarm-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "GITHUB_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Process oldest queued job
        env:
          EDGE_FUNCTION_URL: https://urlrvkkobtvpuefbpowe.supabase.co/functions/v1/clipfarm-worker
          SUPABASE_URL: https://urlrvkkobtvpuefbpowe.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_mO_DDIskW1ym7L3HAF3U1Q_jyO055NG
          WHISPER_MODEL: base
          WHISPER_DEVICE: cpu
          WHISPER_COMPUTE_TYPE: int8
        run: |
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          node build/main.js > "$RUNNER_TEMP/bgutil.log" 2>&1 &
          BGUTIL_PID=$!
          trap 'kill "$BGUTIL_PID" 2>/dev/null || true' EXIT

          READY=false
          for attempt in {1..20}; do
            if python -c 'import socket; s=socket.create_connection(("127.0.0.1", 4416), 1); s.close()'; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "PO-token provider failed to start"
            cat "$RUNNER_TEMP/bgutil.log"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          python worker/main.py
